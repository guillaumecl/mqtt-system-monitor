[package]
name = "mqtt-system-monitor"
description = "Remote System Monitor for Home Assistant with MQTT."
version = "1.2.0"
edition = "2024"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/guillaumecl/mqtt-system-monitor"
repository = "https://github.com/guillaumecl/mqtt-system-monitor"
keywords = ["server", "iot"]
categories = ["command-line-utilities", "network-programming"]
publish = true

[lib]
name = "mqtt_system_monitor"

[dependencies]
log = "0.4"
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde-inline-default = "1.0"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
toml = "1.1"
stderrlog = "0.6.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.39"
strum = "0.28"
strum_macros = "0.28"
convert_case = "0.11"

[dev-dependencies]
minijinja = "2.11"
